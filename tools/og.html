<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@600;700;800&display=block">
<style>
  *{box-sizing:border-box} html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Manrope,Segoe UI,sans-serif;background:#f6f3ec;position:relative;color:#18203f}
  .blob{position:absolute;border-radius:50%;filter:blur(60px)}
  .b1{width:560px;height:560px;right:-60px;top:-160px;background:radial-gradient(circle,#b7c0ff,transparent 65%)}
  .b2{width:420px;height:420px;left:-120px;bottom:-200px;background:radial-gradient(circle,#ffd2b4,transparent 65%)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(24,32,63,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(24,32,63,.05) 1px,transparent 1px);background-size:48px 48px}
  .wrap{position:absolute;inset:0;display:flex;align-items:center;padding:0 0 0 72px;gap:40px}
  .copy{flex:1;min-width:0}
  .eyebrow{font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#e07a3f;font-size:19px;margin:0 0 14px}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:76px;line-height:1;letter-spacing:-.03em;margin:0 0 18px}
  h1 em{color:#3446d4;font-style:italic;font-weight:600}
  .role{font-size:30px;font-weight:800;margin:0 0 26px;color:#2433b2}
  .tags{display:flex;flex-wrap:wrap;gap:10px;max-width:640px}
  .tags span{padding:9px 16px;border-radius:999px;background:#fff;border:1px solid #e5dfd2;font-weight:700;font-size:18px;color:#3c4461}
  .photo{width:380px;height:520px;border-radius:999px 999px 28px 28px;overflow:hidden;margin-right:72px;flex:none;box-shadow:0 30px 70px -20px rgba(36,51,178,.45);position:relative}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 0}
  .ring{position:absolute;width:380px;height:520px;right:54px;top:73px;border-radius:999px 999px 28px 28px;border:2px solid #e07a3f}
  .bar{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(90deg,#3446d4,#5a6af0,#e07a3f)}
</style></head>
<body>
<span class="blob b1"></span><span class="blob b2"></span><span class="grid"></span>
<span class="ring"></span>
<div class="wrap">
  <div class="copy">
    <p class="eyebrow">MBA · HR &amp; Marketing</p>
    <h1>Narasimha<br>Reddy <em>M C</em></h1>
    <p class="role">HR Recruiter · Talent Acquisition</p>
    <div class="tags"><span>Candidate Sourcing</span><span>Resume Screening</span><span>Interview Coordination</span><span>Power BI</span></div>
  </div>
  <div class="photo"><img src="../assets/img/narasimha-portrait.webp" alt=""></div>
</div>
<span class="bar"></span>
</body></html>
